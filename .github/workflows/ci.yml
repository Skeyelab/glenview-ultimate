name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Run on PRs to any branch

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn standard:check

      - name: Run tests
        run: yarn test --coverage --watchAll=false --ci
        env:
          DIRECTUS_URL: https://test-directus.example.com
          DIRECTUS_STATIC_TOKEN: test-token
          NEXT_PUBLIC_DIRECTUS_URL: https://test-directus.example.com

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build
        env:
          DIRECTUS_URL: https://test-directus.example.com
          DIRECTUS_STATIC_TOKEN: test-token
          NEXT_PUBLIC_DIRECTUS_URL: https://test-directus.example.com
          NEXT_PUBLIC_SITE_NAME: Glenview Ultimate

